<!doctype html>
<!-- Source for the Chrome Web Store promo tiles. Render with ./render.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; background: #4e4785; color: #fff; overflow: hidden; }
  .tile { width: 100vw; height: 100vh; display: flex; align-items: center; }
  .small { padding: 0 34px; gap: 22px; }
  .small img.icon { width: 84px; height: 84px; }
  .small h1 { font-size: 38px; letter-spacing: -0.01em; }
  .small p { font-size: 17px; line-height: 1.3; margin-top: 8px; color: #ddd9f5; }
  .marquee { padding-left: 90px; gap: 60px; }
  .marquee .copy { width: 520px; flex: none; }
  .marquee img.icon { width: 88px; height: 88px; margin-bottom: 26px; }
  .marquee h1 { font-size: 56px; letter-spacing: -0.015em; }
  .marquee p { font-size: 26px; line-height: 1.35; margin-top: 16px; color: #ddd9f5; }
  .marquee .shot { height: 470px; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .by { margin-top: 22px; font-size: 18px; color: #c7c2ea; }
</style>
</head>
<body>
<script>
  const kind = new URLSearchParams(location.search).get('kind') || 'small';
  document.body.innerHTML = kind === 'small'
    ? `<div class="tile small"><img class="icon" src="../icon.svg">
         <div><h1>ExportIn</h1><p>Your contacts from LinkedIn, Facebook and Instagram, ready for your CRM</p></div></div>`
    : `<div class="tile marquee"><div class="copy"><img class="icon" src="../icon.svg">
         <h1>ExportIn</h1><p>Your contacts' birthdays and details from LinkedIn, Facebook and Instagram, ready for an AI agent to enrich your CRM</p>
         <div class="by">Free and open source, by tonoïd</div></div>
         <img class="shot" src="../docs/screenshots/01-connections.png"></div>`;
</script>
</body>
</html>
